<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Tutor — Lessons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="lessons.html" class="active">Lessons</a>
            <a href="conversations.html">Conversations</a>
            <a href="testing.html">Test</a>
            <span id="nav-user"></span>
        </nav>

        <!-- Pattern card — shows the MT sentence pattern for this lesson -->
        <div id="lesson-pattern" class="lesson-pattern hidden">
            <div class="pattern-label">This lesson's pattern</div>
            <div class="pattern-fr" id="pattern-fr"></div>
            <div class="pattern-en" id="pattern-en"></div>
        </div>

        <div class="lesson-header">
            <h2 id="word-label">Loading...</h2>
            <div class="lesson-meta">
                <span id="word-score">Score: 0</span>
                <span id="word-attempts">Attempts: 0</span>
                <span id="lesson-progress">Lessons completed: 0 / 10</span>
            </div>
        </div>

        <div id="lesson-chat" class="lesson-chat"></div>

        <!-- Hidden audio element — plays Sophie's TTS responses -->
        <audio id="sophie-audio" hidden></audio>

        <div class="lesson-controls">
            <!-- Mic is the recommended input — prominent at top -->
            <button id="lesson-mic" class="lesson-mic-btn">
                🎤 Hold to speak
            </button>
            <button id="lesson-stop" class="lesson-stop-btn" disabled>
                ⏹ Stop audio
            </button>
            <p class="lesson-mic-hint">Recommended — speak your answer out loud</p>

            <!-- Text is the fallback -->
            <div class="lesson-text-row">
                <input
                    id="lesson-input"
                    type="text"
                    placeholder="or type here..."
                    autocomplete="off"
                />
                <button id="lesson-send">Send</button>
            </div>
        </div>

    </div>
    <script src="auth.js"></script>
    <script>requireAuth(); initNav();</script>
    <script src="lessons.js"></script>
</body>
</html>
